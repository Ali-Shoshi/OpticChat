[package]
name = "optic-chat"
version = "0.1.0"
edition = "2024"
description = "A compact screen-aware desktop coach"
license = "MIT"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-x11", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
libc = "0.2"
futures-util = "0.3"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
directories = "6"
x11rb = "0.13"
pulldown-cmark = { version = "0.13", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
